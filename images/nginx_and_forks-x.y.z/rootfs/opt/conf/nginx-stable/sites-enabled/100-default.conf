    server {
        include common/listen.conf;

        # In case if you send traffic from stream (listened on TLS_PORT) use:
        #include common/listen-proxy_protocol.conf;

        ssl_certificate     /opt/cert/default/fullchain.pem;
        ssl_certificate_key /opt/cert/default/key.pem;

        root /opt/app/html;

        index index.html index.htm;
    }
