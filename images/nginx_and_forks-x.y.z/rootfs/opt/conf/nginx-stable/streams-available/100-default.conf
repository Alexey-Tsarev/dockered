    # This is an example!. Copy this file to streams-enabled/ and edit
    map $ssl_preread_server_name $stream_backend {
        tls.example.com 8.8.8.8:443; # Place your host(s) here
        include common/stream_backend_default.conf;
    }

    server {
        include common/listen_tls.conf;
        ssl_preread on;
        proxy_pass $stream_backend;

        proxy_timeout 1h;
        proxy_connect_timeout 5s;

        # This option is required to use proxy_protocol in `sites-enabled/*.conf` files via:
        # include common/listen-proxy_protocol.conf
        proxy_protocol on;
    }
