user ${USER:-www-data};

worker_processes    auto;
worker_cpu_affinity auto;
error_log           /opt/app/log/error.log warn;
pid                 /run/app.pid;

events {
    # https://nginx.org/en/docs/ngx_core_module.html#worker_connections
    worker_connections ${WORKER_CONNECTIONS:-1024};
}

stream {
    log_format stream_default '[$$time_local] $$remote_addr:$$remote_port $$ssl_preread_server_name $$status sess=$${session_time}s sent=$$bytes_sent recv=$$bytes_received up/time=$$upstream_addr/$$upstream_connect_time';

    access_log /opt/app/log/stream.log ${STREAM_ACCESS_LOG:-stream_default};

    include streams-enabled/*.conf;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    log_format http_default                  '[$$time_local] $$remote_addr:$$remote_port $$ssl_protocol $$http_host $$remote_user "$$request" $$status $$body_bytes_sent "$$http_referer" "$$http_user_agent" "$$realip_remote_addr"';
    log_format http_response_request_gateway '[$$time_local] $$remote_addr:$$remote_port $$ssl_protocol $$http_host $$remote_user "$$request" $$status res=$$body_bytes_sent/$$bytes_sent req=$$request_length/$$content_length gw/time=$$upstream_bytes_sent/$$upstream_bytes_received/$$upstream_connect_time "$$http_referer" "$$http_user_agent" $$realip_remote_addr';

    access_log /opt/app/log/access.log ${HTTP_ACCESS_LOG:-http_default};

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    gzip          on;
    server_tokens off;

    keepalive_timeout             65;
    server_names_hash_bucket_size 64;
    client_max_body_size          128m;

    real_ip_recursive ${REAL_IP_RECURSIVE:-on};
    set_real_ip_from  ${REAL_IP_FROM:-127.0.0.1};

    # https://nginx.org/en/docs/http/ngx_http_map_module.html
    # hack: $$backend_ip, $$backend_port are exist even if they do not set in the `server` directive
    map $$host $$backend_ip   { default "127.0.0.1"; }
    map $$host $$backend_port { default "8080";      }

    map $$http_upgrade $$header_connection {
        default 'upgrade'; # If $$http_upgrade has ANY value, set $$header_connection to "upgrade"
        ''      '';        # If $$http_upgrade is EMPTY,      set $$header_connection to ''
    }

    include sites-enabled/*.conf;
}
