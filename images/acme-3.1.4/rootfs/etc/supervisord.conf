[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
pidfile=/run/supervisord.pid

# Put ACME_OPTS to /etc/environment (it needs to load the value in cron)
[program:environment]
command=/bin/sh -c "echo ACME_OPTS=${ACME_OPTS} > /etc/environment"
priority=1
startretries=1
autorestart=false
stdout_logfile=/opt/log/environment.log
redirect_stderr=true

[program:cron]
command=cron -f
autorestart=true
priority=2

[program:acme]
environment=ACME_REGISTER_ACCOUNT=1,ACME_ISSUE=1,ACME_INSTALL_CERT=1
command=/acme_handler.sh
startretries=1
autorestart=false
stdout_logfile=/opt/log/acme.log
redirect_stderr=true
